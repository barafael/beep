[package]
name = "langis-core"
description = "UI-agnostic Signal backend for langis"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["signal"]
# Real Signal backend (presage + libsignal). Without it only the mock backend is available,
# which keeps UI iteration fast and builds without the libsignal toolchain.
signal = [
    "dep:tracing", "dep:presage", "dep:presage-store-sqlite", "dep:tokio", "dep:futures",
    "dep:directories", "dep:hex", "dep:sqlx", "dep:argon2", "dep:getrandom",
    "dep:keyring-core", "dep:zbus-secret-service-keyring-store",
    "dep:windows-native-keyring-store", "dep:apple-native-keyring-store",
    "dep:libsignal-message-backup", "dep:libsignal-account-keys", "dep:reqwest", "dep:image",
]

[dependencies]
crossbeam-channel.workspace = true
qrcode.workspace = true
zeroize = "1"
tracing = { version = "0.1", optional = true }

presage = { workspace = true, optional = true }
presage-store-sqlite = { workspace = true, optional = true }
tokio = { version = "1.48", features = ["rt", "macros", "time"], optional = true }
futures = { version = "0.3", optional = true }
directories = { version = "6", optional = true }
hex = { version = "0.4", optional = true }
# Same version and features as presage-store-sqlite, so this only adds the options type.
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"], optional = true }
argon2 = { version = "0.5", optional = true }
getrandom = { version = "0.4", optional = true }
keyring-core = { version = "1", optional = true }
# Decodes profile and group pictures; Signal clients upload JPEG or PNG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
libsignal-message-backup = { workspace = true, optional = true }
libsignal-account-keys = { workspace = true, optional = true }
# Same version as libsignal-service; only to download the history archive through its `PushService`.
reqwest = { version = "0.13", default-features = false, optional = true }
jiff = "0.2"
async-channel = "2"

# One OS credential store per platform. On Linux the Secret Service API is served by
# GNOME Keyring as well as KWallet (KF 5.97+), so it covers both desktops.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"], optional = true }

