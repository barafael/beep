[package]
name = "b33p-dioxus"
description = "Signal client for Android, built with Dioxus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
# No renderer by default: `cargo build --workspace` on a desktop then needs no WebView
# libraries. `dx` picks one by platform (`--features mobile` for Android), and `desktop` runs
# the same UI in a window on the development machine.
default = []
mobile = ["dioxus/mobile"]
desktop = ["dioxus/desktop"]
# The real Signal backend (presage and libsignal). Without it the app runs on the core's offline
# mock, which builds in a fraction of the time and sends nothing.
signal = ["b33p-core/signal"]

[dependencies]
b33p-core.workspace = true
dioxus = { version = "0.7", features = [] }
async-channel = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
