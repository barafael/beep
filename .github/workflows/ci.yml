name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    # Debian 12, as the release builds: see .devcontainer/Containerfile.
    container:
      image: docker.io/library/rust:1-bookworm@sha256:e12566d5abc17a0da741628782cdb504b68b8961f5bfcf677936bf3e8b32de29
    # In a container, steps run with sh unless told otherwise; they were written for bash.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: .devcontainer/install-deps.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p b33p-core --all-targets --locked --features test-servers -- -D warnings
      # Without the real backend, as the mock-only UI and xtask (`cargo testbox`) build it: the
      # workspace-wide runs turn `signal` on by unifying features, which hides a missing cfg.
      - run: cargo clippy -p b33p-core --all-targets --locked --no-default-features -- -D warnings
      - run: cargo test --workspace --locked
      # The GPUI window's end-to-end tests drive the app over the agent harness's socket, on GPUI's
      # headless test platform (no display, no GPU): they need the feature, which the run above
      # leaves off.
      - run: cargo test -p b33p-gpui --features harness --locked
      # BoringSSL (contact discovery) can't be linked next to OpenSSL's libcrypto, so SQLCipher must
      # build with the crypto provider in pure Rust (Cargo.toml); without that feature, libsqlite3-sys
      # links the system's libcrypto without a word.
      - run: cargo tree --locked -e features -i libsqlite3-sys | grep bundled-sqlcipher-custom-crypto

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  zizmor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
