# Builds b33p for Linux (AppImage), macOS (.dmg) and Windows (.zip), each for x86_64 and
# arm64. Pushing a `v*` tag publishes them as a GitHub release; running the workflow by hand
# only builds them, as downloadable workflow artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: version
        name: Version from the tag, else from Cargo.toml
        run: |
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version=${GITHUB_REF_NAME#v}
            if [[ "$version" != "$cargo_version"* ]]; then
              echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $cargo_version"
              exit 1
            fi
            label=$version
          else
            version=$cargo_version
            label=$cargo_version-dev.${GITHUB_SHA::7}
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    # Built on Debian 12, so it runs on Debian 12 and newer: see .devcontainer/Containerfile.
    container:
      image: docker.io/library/rust:1-bookworm@sha256:e12566d5abc17a0da741628782cdb504b68b8961f5bfcf677936bf3e8b32de29
    # In a container, steps run with sh unless told otherwise; they were written for bash.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: .devcontainer/install-deps.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Build
        run: |
          cargo build --release --locked -p b33p-slint
          # BoringSSL (contact discovery) is linked in statically; OpenSSL must not come along
          # (Cargo.toml: SQLCipher builds with a crypto provider in pure Rust instead).
          needed=$(readelf -d target/release/b33p | grep NEEDED)
          if grep -E 'libssl|libcrypto' <<<"$needed"; then
            echo "::error::b33p links OpenSSL next to BoringSSL"
            exit 1
          fi
      # The tarball and the .deb use the system's Qt (6.4 or newer); the AppImage brings its own.
      - name: Package tarball
        env:
          NAME: b33p-${{ needs.version.outputs.label }}-linux-${{ matrix.arch }}
        run: |
          mkdir "$NAME"
          cp target/release/b33p packaging/linux/io.github.barafael.B33p.desktop LICENSE README.md "$NAME/"
          cp b33p-slint/assets/b33p.svg "$NAME/io.github.barafael.B33p.svg"
          # xz, as the .deb uses: 12.1 MB instead of gzip's 17.2 MB for this binary.
          tar -I "xz -9 -T0" -cf "$NAME.tar.xz" "$NAME"
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deb
      - name: Package .deb
        env:
          LABEL: ${{ needs.version.outputs.label }}
          DEB: b33p-${{ needs.version.outputs.label }}-linux-${{ matrix.arch }}.deb
        run: |
          # A dev build sorts before its release: 0.1.0~dev.abc1234 < 0.1.0.
          cargo deb -p b33p-slint --no-build --deb-version "${LABEL/-/\~}" --output "$DEB"
          dpkg-deb --info "$DEB"
      - name: Package AppImage
        env:
          ARCH: ${{ matrix.arch }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LINUXDEPLOY_OUTPUT_VERSION: ${{ needs.version.outputs.label }}
          LDAI_OUTPUT: b33p-${{ needs.version.outputs.label }}-linux-${{ matrix.arch }}.AppImage
          # Qt's Wayland client, so b33p runs natively on Wayland desktops, not through XWayland
          # (with its window decorations, which come along with it).
          EXTRA_PLATFORM_PLUGINS: libqwayland-egl.so;libqwayland-generic.so
          # Qt's GTK theme, which the AppImage turns on under GNOME and Xfce: their colours,
          # dark included, rather than Fusion's own.
          DEPLOY_PLATFORM_THEMES: "1"
        run: |
          # Fixed releases, checked: whatever they contain ends up in the AppImage.
          base=https://github.com/linuxdeploy
          curl -fsSLo linuxdeploy "$base/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-$ARCH.AppImage"
          curl -fsSLo linuxdeploy-plugin-qt "$base/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-$ARCH.AppImage"
          case "$ARCH" in
            x86_64)
              sums="c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  linuxdeploy
          15106be885c1c48a021198e7e1e9a48ce9d02a86dd0a1848f00bdbf3c1c92724  linuxdeploy-plugin-qt" ;;
            aarch64)
              sums="620095110d693282b8ebeb244a95b5e911cf8f65f76c88b4b47d16ae6346fcff  linuxdeploy
          bf1c24aff6d749b5cf423afad6f15abd4440f81dec1aab95706b25f6667cdcf1  linuxdeploy-plugin-qt" ;;
          esac
          echo "$sums" | sed 's/^ *//' | sha256sum --check
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          cp b33p-slint/assets/b33p.svg io.github.barafael.B33p.svg
          ./linuxdeploy --appdir AppDir \
            --executable target/release/b33p \
            --desktop-file packaging/linux/io.github.barafael.B33p.desktop \
            --icon-file io.github.barafael.B33p.svg \
            --plugin qt \
            --output appimage
          test -f "$LDAI_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b33p-linux-${{ matrix.arch }}
          path: |
            b33p-*.AppImage
            b33p-*.tar.xz
            b33p-*.deb
          if-no-files-found: error

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: brew install librsvg
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Build
        run: cargo build --release --locked -p b33p-slint
      - name: Package app bundle and disk image
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DMG: b33p-${{ needs.version.outputs.label }}-macos-${{ matrix.arch }}.dmg
        run: |
          app=dmg/b33p.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/b33p "$app/Contents/MacOS/"
          cp LICENSE "$app/Contents/Resources/"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"

          iconset=b33p.iconset
          mkdir -p "$iconset"
          for size in 16 32 128 256 512; do
            rsvg-convert -w $size -h $size b33p-slint/assets/b33p.svg -o "$iconset/icon_${size}x${size}.png"
            rsvg-convert -w $((size * 2)) -h $((size * 2)) b33p-slint/assets/b33p.svg -o "$iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/b33p.icns"

          # Not notarized: an ad-hoc signature only, which Apple Silicon needs to run it at all.
          codesign --force --deep --sign - "$app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname b33p -srcfolder dmg -ov -format UDZO "$DMG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b33p-macos-${{ matrix.arch }}
          path: b33p-*.dmg
          if-no-files-found: error

  windows:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2025
          - arch: aarch64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      # BoringSSL (contact discovery) assembles GNU-style .S files on arm64, which MSVC can't, and
      # Visual Studio projects then link without them. Ninja and clang-cl build them.
      - if: matrix.arch == 'aarch64'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: arm64
      - if: matrix.arch == 'aarch64'
        name: Build BoringSSL with Ninja and clang-cl
        run: |
          ninja --version || choco install ninja -y
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          echo "CC_aarch64_pc_windows_msvc=clang-cl" >> "$GITHUB_ENV"
          echo "CXX_aarch64_pc_windows_msvc=clang-cl" >> "$GITHUB_ENV"
          echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Build
        # Not Git Bash: its /usr/bin/link would stand in for MSVC's link.exe once it's on PATH.
        shell: pwsh
        run: cargo build --release --locked -p b33p-slint
      - name: Package zip
        env:
          ZIP: b33p-${{ needs.version.outputs.label }}-windows-${{ matrix.arch }}.zip
        run: |
          mkdir b33p
          cp target/release/b33p.exe LICENSE b33p/
          # Windows line ends, for Notepad.
          sed 's/$/\r/' packaging/windows/README.txt > b33p/README.txt
          7z a "$ZIP" b33p
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b33p-windows-${{ matrix.arch }}
          path: b33p-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, linux, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # For the release notes in CHANGELOG.md.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: b33p-*
          merge-multiple: true
      - name: Release notes from the changelog
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The section headed "## <version>", up to the next one.
          awk -v version="$VERSION" '
            /^## / { inside = ($2 == version); next }
            inside { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          (cd dist && sha256sum b33p-* > SHA256SUMS)
          prerelease=()
          [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
          # The changelog's notes, then the pull requests GitHub lists.
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "b33p $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
