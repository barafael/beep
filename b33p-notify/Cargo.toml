[package]
name = "b33p-notify"
description = "Desktop notifications with click-to-open and inline reply"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-channel = "2"
tracing = "0.1"

# The freedesktop.org notification service. KDE Plasma adds inline replies to it.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
futures-lite = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
    "UI_Notifications",
    "Win32_UI_Shell",
] }
windows-registry = "0.100"
