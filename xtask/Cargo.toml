[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
b33p-harness.workspace = true
# Its mock voice message, as the box's test audio. Without the `signal` feature.
b33p-core.workspace = true
clap = { version = "4.6", features = ["derive", "env"] }
# The errors, a type per module.
thiserror.workspace = true
# The pictures `stress-content` sends: huge, broken and animated ones. b33p-core's version.
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
serde = { version = "1", features = ["derive"] }
# `--capture`'s decoding (src/wire): HTTP/1.1, HTTP/2's header blocks, WebSocket's
# permessage-deflate, Basic auth's user.
base64 = "0.23"
flate2 = "1"
httparse = "1"
loona-hpack = "0.4"
serde_json = "1"
# `--capture`'s TLS 1.3 undone from the servers' key logs (src/wire/tls.rs): HKDF and the AEADs.
ring = "0.17"
# The pod's containers by name (`Service`).
strum = { version = "0.28", features = ["derive"] }
# The drivers' protocol (src/drivers.rs there), which the Android driver reads too.
testbox-tools = { path = "../testbox/tools" }
# What a run does besides its checks, on stderr: the report stays on stdout.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
