[package]
name = "langis-slint"
description = "Cross-platform Signal client built with Slint"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "langis"
path = "src/main.rs"

[features]
default = ["signal"]
signal = ["langis-core/signal"]

[dependencies]
langis-core.workspace = true
langis-notify = { path = "../langis-notify" }
slint = "1.18"
# Only for whether the window is active (`WindowInner::active`), which slint's API lacks.
# Pinned to the version slint itself pins.
i-slint-core = "=1.18.1"
tracing = "0.1"
async-channel = "2"
# Opens links in the browser.
open = "5"
# The file picker for attachments (the desktop's own, through its portal on Linux).
rfd = "0.15"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pictures and files pasted into the composer (`clipboard.rs`).
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
png = "0.18"

[build-dependencies]
slint-build = "1.18"

# On Linux, render through Qt so the native style draws real Breeze/Qt widgets and follows the
# desktop's colors and fonts. Qt is already resident on KDE; other desktops fall back to winit.
[target.'cfg(target_os = "linux")'.dependencies]
slint = { version = "1.18", features = ["backend-qt"] }

# Asks whether the desktop shows tray icons (`tray::host_present`), and keeps langis to one
# copy (`instance.rs`).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Where the autostart entry goes (`autostart.rs`).
directories = "6"

# Quitting cleanly when the system ends langis (`shutdown.rs`).
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

# The single-instance pipe (`instance.rs`) and the window that hears the session end
# (`shutdown.rs`).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_UI_WindowsAndMessaging",
] }
# The autostart entry (`autostart.rs`).
windows-registry = "0.6"

[dev-dependencies]
# Slint's headless backend for the UI tests in `src/ui_tests.rs`; the version slint pins.
i-slint-backend-testing = "=1.18.1"
