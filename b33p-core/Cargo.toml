[package]
name = "b33p-core"
description = "UI-agnostic Signal backend for b33p"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["signal"]
# Real Signal backend (presage + libsignal). Without it only the mock backend is available,
# which keeps UI iteration fast and builds without the libsignal toolchain.
signal = [
    "dep:presage", "dep:presage-store-sqlite", "dep:tokio", "dep:futures",
    "dep:hex", "dep:sqlx", "dep:argon2", "dep:getrandom",
    "dep:keyring-core", "dep:zbus-secret-service-keyring-store", "dep:zbus",
    "dep:windows-native-keyring-store", "dep:apple-native-keyring-store", "dep:xattr",
    "dep:libsignal-message-backup", "dep:libsignal-account-keys", "dep:reqwest", "dep:image", "dep:protobuf", "dep:chrono", "dep:sha2", "dep:tempfile", "dep:mime_guess", "dep:open", "dep:rustls", "dep:aes-gcm", "dep:hmac", "dep:hkdf", "dep:base64", "dep:rand", "dep:serde", "dep:prost",
    "dep:serde_json", "dep:minisign-verify", "dep:zip",
]
# Links to other servers than Signal's, named by `B33P_SIGNAL_SERVERS` (`link_servers`): for the
# test box. Debug builds only (`compile_error!` in src/signal.rs).
test-servers = ["signal", "dep:toml", "dep:serde_json"]

[dependencies]
thiserror.workspace = true
crossbeam-channel.workspace = true
qrcode.workspace = true
zeroize = "1"
tracing = "0.1"

presage = { workspace = true, optional = true }
presage-store-sqlite = { workspace = true, optional = true }
tokio = { version = "1.53", features = ["rt", "macros", "time", "net", "fs", "sync"], optional = true }
futures = { version = "0.3", optional = true }
directories = "6"
# The computer's name, for the default device name.
gethostname = "1"
# A servers file `B33P_SIGNAL_SERVERS` names (`test-servers`), in presage-cli's TOML form.
toml = { version = "1", optional = true }
# The content log of `test-servers` builds (src/content_log.rs).
serde_json = { version = "1", optional = true }
hex = { version = "0.4", optional = true }
# Same version and features as presage-store-sqlite, so this only adds the options and error
# types (`migrate`: why its migrations refuse a database).
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "migrate"], optional = true }
argon2 = { version = "0.6", optional = true }
getrandom = { version = "0.4", optional = true }
keyring-core = { version = "1", optional = true }
# Decodes avatars, attached pictures and stickers (WebP, sometimes GIF).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"], optional = true }
libsignal-message-backup = { workspace = true, optional = true }
libsignal-account-keys = { workspace = true, optional = true }
# Same versions as libsignal-message-backup and libsignal-service use.
protobuf = { version = "3.7", optional = true }
# Its `DecodeError`, which Signal's messages fail to decode with (libsignal-service's version).
prost = { version = "0.14", default-features = false, features = ["std"], optional = true }
sha2 = { version = "0.11", optional = true }
# Content types of files being sent, and opening received ones in the desktop's default app.
mime_guess = { version = "2", optional = true }
open = { version = "5", optional = true }
# Writes private files atomically (key source, history archive); private test directories.
tempfile = { version = "3", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
# Same version as libsignal-service; only to download the history archive through its `PushService`.
reqwest = { version = "0.13", default-features = false, optional = true }
# The TLS crypto provider for link previews' requests; the one libsignal-service installs.
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
# Writing the storage service (`storage.rs`): its cipher, as libsignal-service has it.
aes-gcm = { version = "0.11", optional = true }
hmac = { version = "0.13", optional = true }
hkdf = { version = "0.13", optional = true }
base64 = { version = "0.23", optional = true }
# Updates (`update.rs`): checking a release's minisign signature, and taking b33p.exe out of
# its zip (deflated, as 7-Zip writes it). GitHub's answer is read with `serde_json`.
minisign-verify = { version = "0.3", optional = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"], optional = true }
rand = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
jiff = "0.2"
async-channel = "2"


[dev-dependencies]
# Property tests of the chat state (`state.rs`).
proptest = "1"
# Signing in minisign's format, with keys made in the test, for the update tests (`update.rs`).
ed25519-dalek = "2"
blake2 = "0.10"

# One OS credential store per platform. On Linux the Secret Service API is served by
# GNOME Keyring as well as KWallet (KF 5.97+), so it covers both desktops.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"], optional = true }
# Hears logind say the computer woke from sleep, to reconnect at once (`signal::receive`).
zbus = { version = "5", default-features = false, features = ["async-io"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"], optional = true }
# Marks saved and opened attachments as downloaded, for Gatekeeper (`attachments.rs`).
xattr = { version = "1", optional = true }

