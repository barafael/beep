[workspace]
members = ["b33p-core", "b33p-dioxus", "b33p-gpui", "b33p-harness", "b33p-notify", "b33p-platform", "b33p-slint", "xtask"]
resolver = "3"
# testbox/tools, testbox/stickers, testbox/vnc, testbox/viewer and testbox/web are workspaces of
# their own (their Cargo.toml say why).
exclude = [
    "testbox/tools",
    "testbox/stickers",
    "testbox/vnc",
    "testbox/viewer",
    "testbox/web",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
# libsignal and presage are AGPL-3.0-only, so anything linking them must be too.
license = "AGPL-3.0-only"
repository = "https://github.com/barafael/beep"
homepage = "https://github.com/barafael/beep"

[workspace.dependencies]
b33p-core = { path = "b33p-core", default-features = false }
b33p-harness = { path = "b33p-harness" }
crossbeam-channel = "0.5"
qrcode = { version = "0.14", default-features = false }
thiserror = "2"

# Branch langis/integration of our Slint fork, which is upstream master now (1.20, as of
# 2026-11-06), nothing more: slint-ui/slint#13985 (selecting text in a `StyledText`) has landed.
# Merge master in when it moves; go back to crates.io once a release carries it.
slint = { git = "https://github.com/barafael/slint", rev = "2a802138dc7f23f9a536675978b7224018af8221", default-features = false }
slint-build = { git = "https://github.com/barafael/slint", rev = "2a802138dc7f23f9a536675978b7224018af8221" }
# The internals b33p names directly. Its helper crates come with the fork.
i-slint-core = { git = "https://github.com/barafael/slint", rev = "2a802138dc7f23f9a536675978b7224018af8221" }
i-slint-common = { git = "https://github.com/barafael/slint", rev = "2a802138dc7f23f9a536675978b7224018af8221" }
i-slint-backend-testing = { git = "https://github.com/barafael/slint", rev = "2a802138dc7f23f9a536675978b7224018af8221" }

# Not on crates.io. Branch langis/integration of our fork: upstream main plus our open pull
# requests, rebuilt 2026-11-09 as one commit per theme, new code in modules of their own
# (registered/receive.rs, registered/groups.rs, keep.rs, settings.rs):
#   build on our libsignal-service fork: servers of one's own (`SignalServers::Custom`), the
#        envelope ack handle, a linked secondary starting with read receipts on (#492 there)
#   settings: one `Settings`, `Manager::set_settings`: automatic link previews off (#478) and
#        stories delivered (#489)
#   the store: paged thread reads (#443); identity changes reported only when real, noted, and
#        pinned, the key a pin refused kept (#449, #450); a replenishment's pre-keys in one
#        transaction, the write lock waited for 30 s (#483)
#   receiving: the loop in a module of its own; `keep`, public and tested, and
#        `Received::Content { content, kept }` saying what was kept; only a message's sender
#        deletes or edits it (#453), an edit found by its latest edit's time (#475), a receipt
#        not taking a message's place, a sender's profile key stored first (#472); one session
#        step and one store transaction per envelope, acked after the commit (#473, #476, on
#        libsignal-service-rs#488, #442, #489), why a message failed to decrypt and retry receipts
#        (#461), `Received::StickerPackInstalled` (#486), `session_lock()` public
#   groups: create, change and join them (#448), the credentials shared (#491); kept current
#        from the changes messages carry and the server's log, missed changes passed on,
#        `update_group`, a fetch tried once more, the storage key from the account entropy pool
#        (#480, #484, #493); a group message sent with a sender key in one request,
#        `renew_sender_key`
#   what a linked device needs: the history archive (#447), the storage service (#444),
#        `refresh_profile` (#487), `identified_push_service` public (#485)
#   sending: a send that met a closed websocket goes again (#464), every story sealed (#490)
#   the client's user agent and languages, set by the application (#492)
#   presage-cli's list-messages doesn't panic (#477)
# The branch before the rebuild is langis/integration-2026-11-09.
# Rebuild the branch when upstream moves or a PR changes; drop it once all have landed.
presage = { git = "https://github.com/barafael/presage", rev = "8057f23b1b4585703ddb9ce154a4a649ba6bbcaf" }
# `cdsi`: Signal's contact discovery, to find someone by phone number (presage's feature). It
# builds BoringSSL (needs cmake and clang), which can't be linked next to OpenSSL's libcrypto, so
# SQLCipher is built with a crypto provider in pure Rust (RustCrypto) instead: no OpenSSL at all.
presage-store-sqlite = { git = "https://github.com/barafael/presage", rev = "8057f23b1b4585703ddb9ce154a4a649ba6bbcaf", features = ["cdsi"] }

# Signal's message-backup format, for the link-time history transfer. Same tag as the libsignal
# that presage pins (see Cargo.lock), so the key and ID types are shared.
# `test-util` only makes its generated protobuf types public; it adds no dependencies. Using
# them keeps us on exactly the schema its parser and validator use.
libsignal-message-backup = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0", features = ["test-util"] }
libsignal-account-keys = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0" }

[patch.crates-io]
# Required by presage-store-sqlite (SQLCipher build); mirrors presage's own workspace patch. Branch
# langis/integration of our fork: whisperfish's plus two pull requests:
#   #2 (not ours) builds on Linux arm64, where `c_char` is unsigned, and stops SQLCipher tearing
#      down at exit while connections still close
#   #3 (ours) the Rust crypto provider builds on Windows without OpenSSL
# Go back to whisperfish's once both have landed.
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/barafael/rusqlite", rev = "3475a314b4c98bcc006eb8143de5ef7bfeda8cbb" }

# Branch langis/integration of our libsignal-service fork: upstream main plus #473 (group changes
# through /v2/groups, with the avatar upload and joins by an open invite link, which presage #448
# needs), #476 (send a sync message to ourselves once, not twice), #481 (don't close a healthy
# socket after a stall), #482 (websocket errors that name their cause, the string reasons in
# `ServiceError` as enums, the task's outcome handed to the pipes), #488 (one session step at a
# time, in order, through a `SessionLock`), #442 (rubdos's envelope ack handle: acknowledged once
# stored, not once read; with #489: a handle dropped unacknowledged leaves the envelope to be
# delivered again, not acknowledged unhandled), servers of one's own (`SignalServers::Custom`, which
# presage's integration branch follows) and #490 (idle connections dropped before the servers drop
# them, and a GET that meets one closing under it sent again (a group fetch failed so, 30 s after
# the last)) and #491 (a replenishment's pre-keys handed to the store at once, so that it can save
# them in one transaction) and #492 (the account's read-receipt setting in the provision message),
# #493 (stories sent as stories, `?story=true`, and only sealed), #494 (a keepalive every 30 s,
# as Signal's apps send), #495 (`Accept-Language` on every request), #496 (a group change
# decrypted once the server's signature shows it), #497 (a group's changes read from the
# server's log) and, without a PR yet, a group send with a sender key in one request.
# Landed upstream and dropped from the branch: #474 (drop sync messages from other
# accounts on the PNI path too), #478 (a read timeout instead of one for the whole request, so the
# history download isn't cut off).
# Drop this once they have landed and presage takes them up.
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { git = "https://github.com/barafael/libsignal-service-rs", rev = "470e2b08712b8755fff752337e223d4b7cc92644" }

# Debug builds (the testbox's among them) with the crypto optimized: unoptimized, decrypting a
# 90 MiB attachment took one core four to ten minutes, and ML-KEM can overflow the stack when
# decrypting a PQXDH prekey message (as presage's own workspace notes).
[profile.dev.package]
aes = { opt-level = 3 }
cbc = { opt-level = 3 }
ctr = { opt-level = 3 }
hmac = { opt-level = 3 }
sha2 = { opt-level = 3 }
libcrux-ml-kem = { opt-level = 3 }
# The picture viewer resamples what it shows whenever the zoom changes: unoptimized, a photo
# took seconds rather than milliseconds.
fast_image_resize = { opt-level = 3 }

[profile.release]
# Optimized for size: 29.3 MB instead of 39.9 MB at opt-level 3 (Linux x86_64). "z" saves another
# 1.6 MB but stops vectorizing loops, which image decoding and the crypto rely on.
opt-level = "s"
# Whole-program LTO across all crates: slower to build, faster and smaller binary.
lto = "fat"
codegen-units = 1
strip = true

# The testbox's optimized b33p (`cargo testbox up --optimized`): built as a release is, but with
# debug assertions, which the `test-servers` feature requires (b33p-core/src/signal/lifecycle.rs)
# so that no release build can talk to servers other than Signal's. Never shipped.
[profile.testbox]
inherits = "release"
debug-assertions = true
