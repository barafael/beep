[workspace]
members = ["langis-core", "langis-notify", "langis-slint", "langis-reactor"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
# libsignal and presage are AGPL-3.0-only, so anything linking them must be too.
license = "AGPL-3.0-only"

[workspace.dependencies]
langis-core = { path = "langis-core", default-features = false }
crossbeam-channel = "0.5"
qrcode = { version = "0.14", default-features = false }

# Not on crates.io. Our fork adds the link-time history transfer on top of upstream 33dd149
# (branch langis/link-history-key); drop it once that lands upstream (whisperfish/presage#430).
presage = { git = "https://github.com/barafael/presage", rev = "9c2119526e393f9010a3548517be775b080b677e" }
presage-store-sqlite = { git = "https://github.com/barafael/presage", rev = "9c2119526e393f9010a3548517be775b080b677e" }

# Signal's message-backup format, for the link-time history transfer. Same tag as the libsignal
# that presage pins (see Cargo.lock), so the key and ID types are shared.
# `test-util` only makes its generated protobuf types public; it adds no dependencies. Using
# them keeps us on exactly the schema its parser and validator use.
libsignal-message-backup = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0", features = ["test-util"] }
libsignal-account-keys = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0" }

[patch.crates-io]
# Required by presage-store-sqlite (SQLCipher build); mirrors presage's own workspace patch.
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = "2a42b3354c9194700d08aa070f70a131a470e7dc" }

# Group changes (creating groups, adding and removing members, …) aren't in libsignal-service
# yet; our fork has them (branch langis/groups, on the revision presage uses). Offered upstream
# as whisperfish/libsignal-service-rs, branch groups-v2-changes of the fork; drop this once
# they land and presage takes them up.
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { git = "https://github.com/barafael/libsignal-service-rs", rev = "f85742f81287f04ba183a2977606e19ff34d7ec1" }

[profile.release]
opt-level = 3
# Whole-program LTO across all crates: slower to build, fastest and smallest binary.
lto = "fat"
codegen-units = 1
strip = true
