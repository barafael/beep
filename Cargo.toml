[workspace]
members = ["b33p-core", "b33p-harness", "b33p-notify", "b33p-slint", "xtask"]
resolver = "3"
# testbox/tools, testbox/stickers, testbox/vnc, testbox/viewer and testbox/web are workspaces of
# their own (their Cargo.toml say why).
exclude = [
    "testbox/tools",
    "testbox/stickers",
    "testbox/vnc",
    "testbox/viewer",
    "testbox/web",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
# libsignal and presage are AGPL-3.0-only, so anything linking them must be too.
license = "AGPL-3.0-only"
repository = "https://github.com/barafael/beep"
homepage = "https://github.com/barafael/beep"

[workspace.dependencies]
b33p-core = { path = "b33p-core", default-features = false }
b33p-harness = { path = "b33p-harness" }
crossbeam-channel = "0.5"
qrcode = { version = "0.14", default-features = false }

# Branch langis/integration of our Slint fork: master (1.19, as of 2026-10-27) plus selecting text
# in a `StyledText` (`selectable`, `has-selection`, `copy()`; slint-ui/slint#13985, as reviewed),
# which the messages need, and the Qt backend drawing emoji (color bitmap glyphs) itself: Qt 6.4's
# QRawFont overruns the heap on them (slint-ui/slint#14449, as reviewed). Landed upstream and
# dropped from the branch: #14426 (the Qt backend draws variable fonts at their default instance,
# not the thinnest). Rebuild the branch when master moves; drop it once these have landed upstream
# and a release carries them.
slint = { git = "https://github.com/barafael/slint", rev = "69f78e918983d0089aebe2a321dc5d1c48e3b0d6", default-features = false }
slint-build = { git = "https://github.com/barafael/slint", rev = "69f78e918983d0089aebe2a321dc5d1c48e3b0d6" }
# The internals b33p names directly. Its helper crates come with the fork.
i-slint-core = { git = "https://github.com/barafael/slint", rev = "69f78e918983d0089aebe2a321dc5d1c48e3b0d6" }
i-slint-common = { git = "https://github.com/barafael/slint", rev = "69f78e918983d0089aebe2a321dc5d1c48e3b0d6" }
i-slint-backend-testing = { git = "https://github.com/barafael/slint", rev = "69f78e918983d0089aebe2a321dc5d1c48e3b0d6" }

# Not on crates.io. Branch langis/integration of our fork: upstream main plus each of our
# open pull requests, so b33p builds on exactly what is proposed upstream:
#   #443 paged thread reads                         #444 storage service from a linked device
#   #447 wait for the history archive
#   #448 create and change groups, accept or decline invitations, retry a clashing change,
#        the group picture, invite links and join requests, a request told to the members we
#        know, as Signal-Desktop does, and its group without a stale picture (needs
#        libsignal-service-rs#473)
#   #449 report only real identity changes, and note them in the contact's thread
#   #450 pin an identity required for sending (verified contacts' changed keys wait), and keep
#        the key a pin refused, so that it can be shown and taken over
#   #461 why a message failed to decrypt, and from which device and when, and retry receipts as
#        their own event
#   #453 only a message's sender deletes or edits it
#   #464 a send retried once when the websocket closed under it
#   servers of one's own: `SignalServers::Custom` carries its configuration (follows our
#        libsignal-service branch)
#   #472 a sender's profile key stored before the message is handed on, not left to the task
#        that fetches their profile
#   #473 the manager's ciphers and senders share one session lock (needs
#        libsignal-service-rs#488)
#   #475 an edited message is found by its latest edit's time, which Signal's apps name it by
#   #476 an envelope is decrypted and its message kept in one store transaction, and
#        acknowledged after it: a receiver stopping midway neither loses the message nor has
#        it acknowledged unkept (on #473; needs libsignal-service-rs#442 and #489)
#   (no PR yet) a receipt doesn't keep a message out of the store, nor take its place (with
#        #453)
#   #477 presage-cli's list-messages doesn't panic
#   #478 a setting to turn automatic link previews off: since #359 presage fetches the page of
#        every message's first link, which b33p leaves to its user's `link_previews`
#   #480 a group whose fetch failed is fetched once more,
#        and the error logged with its causes
# Rebuilt on upstream main past #454, 2026-10-27.
# Landed upstream and dropped from the branch: #442 (history-transfer key on
# RegistrationData), #446 (a linked device unlinks itself), #452 (no panic on a group
# master key of the wrong length), #454 (write transactions take the lock up front) and #460
# (the provisioning link logged at debug instead of info); #445 (drop sync messages from other
# accounts) is now libsignal-service-rs#474's job.
# Rebuild the branch when upstream moves or a PR changes; drop it once all have landed.
presage = { git = "https://github.com/barafael/presage", rev = "a1f75aaa5e57b109b475930dd1114abacf599555" }
# `cdsi`: Signal's contact discovery, to find someone by phone number (presage's feature). It
# builds BoringSSL (needs cmake and clang), which can't be linked next to OpenSSL's libcrypto, so
# SQLCipher is built with a crypto provider in pure Rust (RustCrypto) instead: no OpenSSL at all.
presage-store-sqlite = { git = "https://github.com/barafael/presage", rev = "a1f75aaa5e57b109b475930dd1114abacf599555", features = ["cdsi"] }

# Signal's message-backup format, for the link-time history transfer. Same tag as the libsignal
# that presage pins (see Cargo.lock), so the key and ID types are shared.
# `test-util` only makes its generated protobuf types public; it adds no dependencies. Using
# them keeps us on exactly the schema its parser and validator use.
libsignal-message-backup = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0", features = ["test-util"] }
libsignal-account-keys = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.0" }

[patch.crates-io]
# Required by presage-store-sqlite (SQLCipher build); mirrors presage's own workspace patch. Branch
# langis/integration of our fork: whisperfish's plus two pull requests:
#   #2 (not ours) builds on Linux arm64, where `c_char` is unsigned, and stops SQLCipher tearing
#      down at exit while connections still close
#   #3 (ours) the Rust crypto provider builds on Windows without OpenSSL
# Go back to whisperfish's once both have landed.
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/barafael/rusqlite", rev = "3475a314b4c98bcc006eb8143de5ef7bfeda8cbb" }

# Branch langis/integration of our libsignal-service fork: upstream main plus #473 (group changes
# through /v2/groups, with the avatar upload and joins by an open invite link, which presage #448
# needs), #476 (send a sync message to ourselves once, not twice), #481 (don't close a healthy
# socket after a stall), #482 (websocket errors that name their cause, the string reasons in
# `ServiceError` as enums, the task's outcome handed to the pipes), #488 (one session step at a
# time, in order, through a `SessionLock`), #442 (rubdos's envelope ack handle: acknowledged once
# stored, not once read; with #489: a handle dropped unacknowledged leaves the envelope to be
# delivered again, not acknowledged unhandled), servers of one's own (`SignalServers::Custom`, which
# presage's integration branch follows) and #490 (idle connections dropped before the servers drop
# them, and a GET that meets one closing under it sent again (a group fetch failed so, 30 s after
# the last)). Landed upstream and dropped from the branch: #474 (drop sync messages from other
# accounts on the PNI path too), #478 (a read timeout instead of one for the whole request, so the
# history download isn't cut off).
# Drop this once they have landed and presage takes them up.
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { git = "https://github.com/barafael/libsignal-service-rs", rev = "33f271d1fda1328d164276a1ebaca07c58f58433" }

[profile.release]
# Optimized for size: 29.3 MB instead of 39.9 MB at opt-level 3 (Linux x86_64). "z" saves another
# 1.6 MB but stops vectorizing loops, which image decoding and the crypto rely on.
opt-level = "s"
# Whole-program LTO across all crates: slower to build, faster and smaller binary.
lto = "fat"
codegen-units = 1
strip = true

# The testbox's optimized b33p (`cargo testbox up --optimized`): built as a release is, but with
# debug assertions, which the `test-servers` feature requires (b33p-core/src/signal/lifecycle.rs)
# so that no release build can talk to servers other than Signal's. Never shipped.
[profile.testbox]
inherits = "release"
debug-assertions = true
