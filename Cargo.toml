[workspace]
members = ["b33p-core", "b33p-harness", "b33p-notify", "b33p-platform", "b33p-slint", "xtask"]
resolver = "3"
# testbox/tools, testbox/stickers, testbox/vnc, testbox/viewer and testbox/web are workspaces of
# their own (their Cargo.toml say why).
exclude = [
    "testbox/tools",
    "testbox/stickers",
    "testbox/vnc",
    "testbox/viewer",
    "testbox/web",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
# libsignal and presage are AGPL-3.0-only, so anything linking them must be too.
license = "AGPL-3.0-only"
repository = "https://github.com/barafael/beep"

[workspace.dependencies]
b33p-core = { path = "b33p-core", default-features = false }
b33p-harness = { path = "b33p-harness" }
crossbeam-channel = "0.5"
qrcode = { version = "0.15", default-features = false }
thiserror = "2"

# Branch slint/integration-branch of our Slint fork: upstream master plus our open pull requests
# (and edualc's `edualc-text`); the branch's `integration.sh` lists them and rebuilds it.
# Go back to crates.io once a release carries what b33p uses.
slint = { git = "https://github.com/barafael/slint", rev = "e1185c98db67cce0dc0d84fbd1025d8735722b5f", default-features = false }
slint-build = { git = "https://github.com/barafael/slint", rev = "e1185c98db67cce0dc0d84fbd1025d8735722b5f" }
# The internals b33p names directly. Its helper crates come with the fork.
i-slint-core = { git = "https://github.com/barafael/slint", rev = "e1185c98db67cce0dc0d84fbd1025d8735722b5f" }
i-slint-common = { git = "https://github.com/barafael/slint", rev = "e1185c98db67cce0dc0d84fbd1025d8735722b5f" }
i-slint-backend-testing = { git = "https://github.com/barafael/slint", rev = "e1185c98db67cce0dc0d84fbd1025d8735722b5f" }
i-slint-backend-selector = { git = "https://github.com/barafael/slint", rev = "e1185c98db67cce0dc0d84fbd1025d8735722b5f", default-features = false }

# Not on crates.io. Branch langis/integration of our fork: upstream main plus our open pull
# requests, one commit per theme (2026-11-09), new code in modules of their own
# (registered/receive.rs, registered/groups.rs, keep.rs, settings.rs); rebased 2026-11-19 on
# upstream main 7a5c2c7 (what a contacts sync saved #470, one sticker of a pack #507, message
# reads with a limit and an order #502, which replaces our paged reads #443), built on
# libsignal-service's with libsignal 0.106.2:
#   build on our libsignal-service fork: servers of one's own (`SignalServers::Custom`), the
#        envelope ack handle, a linked secondary starting with read receipts on (#492 there)
#   settings: one `Settings`, `Manager::set_settings`: automatic link previews off (#478) and
#        stories delivered (#489)
#   the store: identity changes reported only when real, noted, and
#        pinned, the key a pin refused kept (#449, #450); a replenishment's pre-keys in one
#        transaction, the write lock waited for 30 s (#483)
#   receiving: the loop in a module of its own; `keep`, public and tested, and
#        `Received::Content { content, kept }` saying what was kept; only a message's sender
#        deletes or edits it (#453), an edit found by its latest edit's time (#475), a receipt
#        not taking a message's place, a sender's profile key stored first (#472); one session
#        step and one store transaction per envelope, acked after the commit (#473, #476, on
#        libsignal-service-rs#488, #442, #489), why a message failed to decrypt and retry receipts
#        (#461), `Received::StickerPackInstalled` (#486), `session_lock()` public
#   groups: create, change and join them (#448), the credentials shared (#491); kept current
#        from the changes messages carry and the server's log, missed changes passed on,
#        `update_group`, a fetch tried once more, the storage key from the account entropy pool
#        (#480, #484, #493); a group message sent with a sender key in one request,
#        `renew_sender_key`
#   what a linked device needs: the history archive (#447), the storage service (#444),
#        `refresh_profile` (#487), `identified_push_service` public (#485)
#   sending: a send that met a closed websocket goes again (#464, closed: parked until sending
#        moves to gRPC), every story sealed (#490)
#   the client's user agent and languages, set by the application (#492)
#   presage-cli's list-messages doesn't panic (#477)
#   a linked device leaves the account to the primary: only its capabilities, no account
#        attributes (which reset the registration lock and discoverability), and no answers to
#        sync requests (an empty block list unblocked everyone); the primary told by its device
#        ID (#503)
#   typing indicators only for devices online, a sender-key send as urgent as its content
#        (#490)
#   a message kept from before a stop is tried again at each start, up to five times, and a
#        message is forgotten only once the consumer asks for the next, so b33p's own handling of it
#        survives a crash or a quit (#476)
#   a group's members' profile keys kept, so a member who never wrote to us alone is sent to
#        sealed and with the group's sender key (#448); our own profile key replaceable as the
#        primary changes it, `Manager::set_profile_key` (#503)
#   a group's "only admins send" and "ended" kept, from its state and its changes (#493)
#   what the server warned of on connecting, `Manager::server_alerts` (no PR yet)
#   our PNI signature to whoever wrote to our PNI, until their delivery receipt (#504)
#   a message known by its sender and time, `thread_messages` keyed so: two senders at one
#        millisecond both kept, of one account's two devices the first; a delete for everyone
#        takes the message out (#499 carries it upstream); a page read with a limit holds all
#        the messages at its last time, so the next page misses none
#   a thread's messages found by their time (`ts BETWEEN`), through the index b33p makes, and
#        newest first the exact reverse of oldest first (no PR yet)
#   a story to a story list (My Story) in one request with a sender key for the list,
#        `send_story_to_list` (no PR yet; on libsignal-service's pr/story-list-send)
# The branch before the rebase is tag archive/2026-11-19/langis/integration.
# Rebase the branch when upstream moves or a PR changes; drop it once all have landed.
presage = { git = "https://github.com/barafael/presage", rev = "cfa78084874d67f5b4a65239c52cbc7409c0bb32" }
# `cdsi`: Signal's contact discovery, to find someone by phone number (presage's feature). It
# builds BoringSSL (needs cmake and clang), which can't be linked next to OpenSSL's libcrypto, so
# SQLCipher is built with a crypto provider in pure Rust (RustCrypto) instead: no OpenSSL at all.
presage-store-sqlite = { git = "https://github.com/barafael/presage", rev = "cfa78084874d67f5b4a65239c52cbc7409c0bb32", features = ["cdsi"] }

# Signal's message-backup format, for the link-time history transfer. Same tag as the libsignal
# that presage pins (see Cargo.lock), so the key and ID types are shared.
# `test-util` only makes its generated protobuf types public; it adds no dependencies. Using
# them keeps us on exactly the schema its parser and validator use.
libsignal-message-backup = { git = "https://github.com/signalapp/libsignal", tag = "v0.106.2", features = ["test-util"] }
libsignal-account-keys = { git = "https://github.com/signalapp/libsignal", tag = "v0.106.2" }

[patch.crates-io]
# Required by presage-store-sqlite (SQLCipher build); mirrors presage's own workspace patch. Branch
# langis/integration of our fork: whisperfish's plus two pull requests:
#   #2 (not ours) builds on Linux arm64, where `c_char` is unsigned, and stops SQLCipher tearing
#      down at exit while connections still close
#   #3 (ours) the Rust crypto provider builds on Windows without OpenSSL
# Go back to whisperfish's once both have landed.
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/barafael/rusqlite", rev = "3475a314b4c98bcc006eb8143de5ef7bfeda8cbb" }

# Branch langis/integration of our libsignal-service fork, built by its integration.sh: upstream
# main (libsignal 0.106.2) with each of our pull request branches merged in, and those without a
# pull request yet (servers of one's own, a sealed plaintext carrying only a decryption error, a
# group send with a sender key in one request, a story list's without a group id). The script
# lists them; a merge done by hand is kept as branch merge/<topic>.
# Upstream merged five of them on 2026-11-19 (groups #473, provisioning read receipts #492,
# the 30 s keepalive #494, device capabilities #503, contact sync panics #504); they're gone
# from the list.
# Drop this once they have landed and presage takes them up.
[patch."https://github.com/whisperfish/libsignal-service-rs"]
libsignal-service = { git = "https://github.com/barafael/libsignal-service-rs", rev = "5ef972a7f34b04918a531faefbe152eccf7fc45b" }

# Debug builds (the testbox's among them) with the crypto optimized: unoptimized, decrypting a
# large attachment took minutes, and ML-KEM can overflow the stack when
# decrypting a PQXDH prekey message (as presage's own workspace notes).
[profile.dev.package]
aes = { opt-level = 3 }
cbc = { opt-level = 3 }
ctr = { opt-level = 3 }
hmac = { opt-level = 3 }
sha2 = { opt-level = 3 }
libcrux-ml-kem = { opt-level = 3 }
# The picture viewer resamples what it shows whenever the zoom changes: unoptimized, a photo
# took seconds rather than milliseconds.
fast_image_resize = { opt-level = 3 }
# Decoding pictures, and the PNGs and JPEGs b33p makes of them: unoptimized, a phone photo took
# seconds to decode rather than milliseconds, which hid in debug builds (and the test box's) what
# showing pictures costs in the builds people run.
image = { opt-level = 3 }
zune-jpeg = { opt-level = 3 }
zune-core = { opt-level = 3 }
png = { opt-level = 3 }
fdeflate = { opt-level = 3 }
miniz_oxide = { opt-level = 3 }
simd-adler32 = { opt-level = 3 }
crc32fast = { opt-level = 3 }
image-webp = { opt-level = 3 }
gif = { opt-level = 3 }
weezl = { opt-level = 3 }
blurhash = { opt-level = 3 }

[profile.release]
# Optimized for size: much smaller than at opt-level 3. "z" is smaller still but stops vectorizing
# loops, which image decoding and the crypto rely on.
opt-level = "s"
# Whole-program LTO across all crates: slower to build, faster and smaller binary.
lto = "fat"
codegen-units = 1
strip = true

# The testbox's optimized b33p (`cargo testbox up --optimized`): built as a release is, but with
# debug assertions, which the `test-servers` feature requires (b33p-core/src/signal/lifecycle.rs)
# so that no release build can talk to servers other than Signal's. Never shipped.
[profile.testbox]
inherits = "release"
debug-assertions = true
