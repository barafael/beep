[package]
name = "b33p-slint"
description = "Cross-platform Signal client built with Slint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "b33p"
path = "src/main.rs"

[features]
default = ["signal", "gpu-skia"]
signal = ["b33p-core/signal"]
# The agent harness (`agent.rs`, `B33P_AGENT_SOCKET`): a socket a script can use to read what
# the window shows and to act as if it were the input, for tests and demonstrations. Unix
# only; never part of a release build.
harness = ["dep:b33p-harness", "b33p-harness/core", "dep:serde", "dep:serde_json", "dep:i-slint-backend-testing"]
test-servers = ["b33p-core/test-servers"]
# What draws the window on Linux, in Slint's Fluent style. On the other platforms Slint's own
# winit window and FemtoVG draw it whichever of these is on.
#   gpu-skia      Slint's winit backend (Wayland and X11) with Skia, Vulkan if the driver has it
#                 and OpenGL if not (the default).
#   gpu-femtovg   the same with FemtoVG on OpenGL; lighter to build, heavier to run.
# Build the other with `--no-default-features --features signal,gpu-femtovg`.
gpu-femtovg = ["slint/backend-winit", "slint/renderer-femtovg"]
gpu-skia = ["slint/backend-winit", "slint/renderer-skia-vulkan"]

[dependencies]
thiserror.workspace = true
b33p-core.workspace = true
b33p-notify = { path = "../b33p-notify" }
b33p-platform = { path = "../b33p-platform" }
# Slint's defaults are off; each platform picks its backend and renderer below.
slint = { workspace = true, features = ["std", "compat-1-2", "accessibility", "system-tray"] }
# Only for whether the window is active (`WindowInner::active`), which slint's API lacks.
# Internal, so taken at the same revision as slint (see the workspace's fork pin).
i-slint-core.workspace = true
tracing = "0.1"
async-channel = "2"
# Answers from the desktop actor (`desktop.rs`).
futures-channel = "0.3"
# The harness's JSON protocol (`agent.rs`, its types in b33p-harness).
b33p-harness = { workspace = true, optional = true }
# `B33P_HEADLESS`: the harness tests' window system (`main.rs`).
i-slint-backend-testing = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# Opens links in the browser.
open = "5"
png = "0.18"
# Blurred stand-ins for pictures and videos not downloaded yet.
blurhash = "0.2"
# Every emoji, by group and name, for the emoji picker (`emoji.rs`).
emojis = "0.9"

[build-dependencies]
slint-build.workspace = true
# The icons (Lucide), written out for the UI to use as `@image-url("@lucide/<name>.svg")`.
lucide-static-svg = "1.70"

# The program's icon and version in the Windows executable (`assets/b33p.rc`).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# Off Linux, Slint's own window and FemtoVG (the `gpu-*` features choose on Linux).
[target.'cfg(not(target_os = "linux"))'.dependencies]
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg"] }

# Quitting cleanly when the system ends b33p (`shutdown.rs`).
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

# The window that hears the session end (`shutdown.rs`), and the window kept out of screen
# capture (`capture.rs`).
[target.'cfg(windows)'.dependencies]
# The winit hook for Ctrl shortcuts during IME composition (`keys.rs`).
slint = { workspace = true, features = ["raw-window-handle-06", "unstable-winit-030"] }
# The version Slint's `raw-window-handle-06` hands out.
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    # The Start menu shortcut (`install.rs`).
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    # The memory log (`memory.rs`).
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    # The unread count on the taskbar button (`badge.rs`).
    "Win32_System_Com",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
] }
# The autostart entry (`autostart.rs`) and the "Installed apps" entry (`install.rs`).
windows-registry = "0.6"
# Uninstalling deletes the running exe once it has ended (`install.rs`).
self-replace = "1.5"

[dev-dependencies]
# Slint's headless backend for the UI tests in `src/ui_tests.rs`; the same revision as slint.
i-slint-backend-testing.workspace = true
# Slint's Markdown parser, which `StyledText` keeps to itself: the property tests in
# `src/markdown.rs` check the links and text it makes of message text.
i-slint-common = { workspace = true, features = ["markdown"] }
proptest = "1"
# The folders the install tests lay out and remove (`install.rs`).
tempfile = "3"

# The .deb for Debian and Ubuntu (`cargo deb`, run by the release workflow). `$auto` reads the
# libraries it needs (ALSA, …) off the binary; Skia loads Vulkan or EGL when it starts, which the
# binary doesn't name, so one of them is asked for outright.
[package.metadata.deb]
name = "b33p"
maintainer = "Rafael Bachmann <rafael.bachmann.93@gmail.com>"
extended-description = "A desktop Signal client, drawn on the GPU."
section = "net"
priority = "optional"
depends = "$auto, libegl1 | libvulkan1"
license-file = ["../LICENSE", "0"]
assets = [
    ["target/release/b33p", "usr/bin/", "755"],
    ["../packaging/linux/io.github.barafael.B33p.desktop", "usr/share/applications/", "644"],
    ["assets/b33p.svg", "usr/share/icons/hicolor/scalable/apps/io.github.barafael.B33p.svg", "644"],
]
