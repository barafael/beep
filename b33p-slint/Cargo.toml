[package]
name = "b33p-slint"
description = "Cross-platform Signal client built with Slint"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "b33p"
path = "src/main.rs"

[features]
default = ["signal"]
signal = ["b33p-core/signal"]
# The agent harness (`agent.rs`, `B33P_AGENT_SOCKET`): a socket a script can use to read what
# the window shows and to act as if it were the input, for tests and demonstrations. Unix
# only; never part of a release build.
harness = ["dep:b33p-harness", "b33p-harness/core", "dep:serde", "dep:serde_json"]
test-servers = ["b33p-core/test-servers"]

[dependencies]
b33p-core.workspace = true
b33p-notify = { path = "../b33p-notify" }
# Slint's defaults bring both the winit and the Qt backend; each platform picks one below.
slint = { workspace = true, features = ["std", "compat-1-2", "accessibility", "system-tray"] }
# Only for whether the window is active (`WindowInner::active`), which slint's API lacks.
# Internal, so taken at the same revision as slint (see the workspace's fork pin).
i-slint-core.workspace = true
tracing = "0.1"
async-channel = "2"
# The harness's JSON protocol (`agent.rs`, its types in b33p-harness).
b33p-harness = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# Whether the desktop asks for reduced motion (`motion.rs`).
mundy = { version = "0.2.3", default-features = false, features = ["reduced-motion", "callback", "async-io"] }
# Opens links in the browser.
open = "5"
# The file picker for attachments (the desktop's own, through its portal on Linux).
rfd = "0.17"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pictures and files pasted into the composer (`clipboard.rs`).
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
png = "0.18"
# Blurred stand-ins for pictures and videos not downloaded yet.
blurhash = "0.2"
# Plays audio and voice messages (`audio.rs`): Signal sends AAC (in MP4 or ADTS), others Ogg,
# MP3, FLAC, WAV.
rodio = { version = "0.23", default-features = false, features = ["playback", "mp4", "mp3", "vorbis", "flac", "wav", "symphonia-pcm"] }
# Every emoji, by group and name, for the emoji picker (`emoji.rs`).
emojis = "0.9"

[build-dependencies]
slint-build.workspace = true
# The icons (Lucide), written out for the UI to use as `@image-url("@lucide/<name>.svg")`.
lucide-static-svg = "1.55"

# The program's icon and version in the Windows executable (`assets/b33p.rc`).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

# On Linux, render through Qt only, so the native style draws real Breeze/Qt widgets and follows
# the desktop's colors and fonts. Qt 6 is required at runtime; there is no winit fallback.
[target.'cfg(target_os = "linux")'.dependencies]
slint = { workspace = true, features = ["backend-qt"] }

# Elsewhere, Slint's own window and renderer.
[target.'cfg(not(target_os = "linux"))'.dependencies]
slint = { workspace = true, features = ["backend-winit", "renderer-femtovg"] }

# Asks whether the desktop shows tray icons (`tray::host_present`), and keeps b33p to one
# copy (`instance.rs`).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Where the autostart entry goes (`autostart.rs`).
directories = "6"

# Quitting cleanly when the system ends b33p (`shutdown.rs`).
[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

# The single-instance pipe (`instance.rs`), the window that hears the session end
# (`shutdown.rs`), and the window kept out of screen capture (`capture.rs`).
[target.'cfg(windows)'.dependencies]
slint = { workspace = true, features = ["raw-window-handle-06"] }
# The version Slint's `raw-window-handle-06` hands out.
raw-window-handle = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_UI_WindowsAndMessaging",
] }
# The autostart entry (`autostart.rs`).
windows-registry = "0.6"

[dev-dependencies]
# Slint's headless backend for the UI tests in `src/ui_tests.rs`; the same revision as slint.
i-slint-backend-testing.workspace = true
# Slint's Markdown parser, which `StyledText` keeps to itself: the property tests in
# `src/markdown.rs` check the links and text it makes of message text.
i-slint-common = { workspace = true, features = ["markdown"] }
proptest = "1"
# Scratch directories for the log file tests.
tempfile = "3"

# The .deb for Debian and Ubuntu (`cargo deb`, run by the release workflow). It uses the system's
# Qt, so the desktop's own style and theme plugins load; `$auto` reads the libraries it needs
# (Qt 6, ALSA, …) off the binary.
[package.metadata.deb]
name = "b33p"
maintainer = "Rafael Bachmann <rafael.bachmann.93@gmail.com>"
extended-description = "A desktop Signal client. Uses the system's Qt 6, so it looks like the rest of the desktop."
section = "net"
priority = "optional"
depends = "$auto"
license-file = ["../LICENSE", "0"]
assets = [
    ["target/release/b33p", "usr/bin/", "755"],
    ["../packaging/linux/io.github.barafael.B33p.desktop", "usr/share/applications/", "644"],
    ["assets/b33p.svg", "usr/share/icons/hicolor/scalable/apps/io.github.barafael.B33p.svg", "644"],
]
